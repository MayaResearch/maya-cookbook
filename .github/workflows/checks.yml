name: Cookbook checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
permissions:
  contents: read
jobs:
  keyless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: python scripts/check_repo.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile && pnpm test && pnpm check
        working-directory: quickstarts/typescript
  recipe-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: integrations/livekit
            module: agent
            sources: '--no-sources'
          - folder: integrations/pipecat
            module: bot
            sources: ''
          - folder: examples/voice-agent-from-scratch
            module: agent
            sources: ''
          - folder: examples/streaming-tts
            module: stream
            sources: ''
          - folder: quickstarts/python
            module: tts
            sources: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked ${{ matrix.sources }}
        working-directory: ${{ matrix.folder }}
      - run: uv run --locked ${{ matrix.sources }} python -c 'import ${{ matrix.module }}'
        working-directory: ${{ matrix.folder }}
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_sources.py
# No live provider keys, no pull_request_target, no uploads of customer data.
