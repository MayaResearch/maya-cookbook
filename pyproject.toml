[project]
name = "maya-cookbook-checks"
version = "0.1.0"
description = "Development checks for Maya Research cookbook examples; not an SDK"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.15.5", "websockets==15.0.1", "httpx==0.28.1", "python-dotenv==1.2.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
